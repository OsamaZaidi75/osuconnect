# OsuConnect production stack for the Oracle Cloud ARM64 VM.
#
# Usage (from this directory):
#   cp env.example .env.prod   # then fill in every value
#   docker compose --env-file .env.prod up -d --build
#
# Only Caddy (80/443) and LiveKit media ports (7881/tcp, 7882/udp) are public.
# Everything else stays on the internal Compose network.
name: osuconnect

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?PUBLIC_DOMAIN required}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend
      - livekit

  backend:
    build:
      context: ../..
      dockerfile: backend/Dockerfile.prod
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-semaphore}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}@postgres:5432/${POSTGRES_DB:-semaphore}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD required}
      FILE_UPLOAD_DEST: /app/uploads
      LIVEKIT_URL: wss://${PUBLIC_DOMAIN}/livekit
      LIVEKIT_INTERNAL_URL: http://livekit:7880
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

  frontend:
    build:
      context: ../..
      dockerfile: frontend/Dockerfile.prod
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:3000
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5173/health"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3

  livekit:
    image: livekit/livekit-server:v1.13.7
    restart: unless-stopped
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        rtc:
          tcp_port: 7881
          udp_port: 7882
          use_external_ip: false
          node_ip: ${PUBLIC_IP:?PUBLIC_IP required}
        redis:
          address: redis:6379
          password: ${REDIS_PASSWORD}
        keys:
          ${LIVEKIT_API_KEY:?LIVEKIT_API_KEY required}: ${LIVEKIT_API_SECRET:?LIVEKIT_API_SECRET required}
        webhook:
          api_key: ${LIVEKIT_API_KEY}
          urls:
            - http://backend:3000/api/livekit/webhook
    ports:
      - "7881:7881"
      - "7882:7882/udp"
    depends_on:
      redis:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-semaphore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: ${POSTGRES_DB:-semaphore}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-semaphore}"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD required}", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 10s
      retries: 10
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
  uploads:
  caddy_data:
  caddy_config:
